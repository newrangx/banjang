<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>checking</title></head>
<body style="background:#111;color:#eee;font:13px/1.6 monospace"><pre id="o">checking…</pre>
<script>
function extract(html){
  var re=/<script(?![^>]*\bsrc=)(?![^>]*id="(?:data|imgmap)")[^>]*>([\s\S]*?)<\/script>/g, m, out=[];
  while((m=re.exec(html))) out.push(m[1]);
  return out;
}
Promise.all(['_check/index.html','_check/admin.html'].map(function(f){ return fetch(f,{cache:'no-store'}).then(function(r){ return r.text(); }); }))
 .then(function(txt){
   var names=['index.html','admin.html'], lines=[], bad=0;
   txt.forEach(function(t,i){
     var parts=extract(t);
     lines.push(names[i]+': '+parts.length+' inline script(s)');
     parts.forEach(function(code,j){
       try { new Function(code); lines.push('  script '+j+': OK ('+code.length+' bytes)'); }
       catch(e){ bad++; lines.push('  script '+j+': FAIL '+e.name+': '+e.message); }
     });
   });
   document.getElementById('o').textContent = lines.join('\n');
   document.title = bad ? ('FAIL '+bad) : 'OK';
   var d=document.createElement('div'); d.id='res'; d.textContent=bad?'FAIL':'OK'; document.body.appendChild(d);
 })
 .catch(function(e){ document.getElementById('o').textContent='FETCH ERR '+e; document.title='ERR'; });
</script>
</body></html>
