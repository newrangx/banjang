<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390px 검증 (임시)</title>
<style>html,body{margin:0;background:#3a3a3a}iframe{display:block;width:390px;height:2600px;border:0;background:#000}</style>
</head>
<body>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var f = document.createElement('iframe');
  f.src = q.get('src') || './';
  f.onload = function(){
    var y = +(q.get('y') || 0);
    setTimeout(function(){ try { f.contentWindow.scrollTo(0, y); } catch(e){} }, 900);
  };
  document.body.appendChild(f);
})();
</script>
</body>
</html>
