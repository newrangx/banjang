<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390 미리보기 (임시)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;background:#444}iframe{display:block;width:390px;height:1500px;border:0;margin:0}</style>
</head>
<body>
<iframe id="f" title="모바일 미리보기"></iframe>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var f0 = document.getElementById('f');
  f0.src = q.get('src') || './index.html?m=1';
  var to = q.get('to'), off = parseInt(q.get('off') || '0', 10);
  var f = document.getElementById('f');
  f.addEventListener('load', function(){
    setTimeout(function(){
      try {
        var w = f.contentWindow, d = f.contentDocument;
        if (!to) return;
        var el = d.getElementById(to);
        if (!el) return;
        var y = el.getBoundingClientRect().top + w.scrollY - off;
        w.scrollTo(0, Math.max(0, y));
      } catch(e){}
    }, 2200);
  });
})();
</script>
</body>
</html>
