<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>카드 3단 검증 (임시)</title>
<style>html,body{margin:0;background:#666}iframe{display:block;width:1000px;height:1000px;border:0}</style>
</head>
<body>
<iframe id="f" src="./notices.html?dup=1" title="카드 검증"></iframe>
<script>
document.getElementById('f').addEventListener('load', function(){
  setTimeout(function(){
    try{
      var d = this.contentDocument;
      var grid = d.querySelector('.ncards');
      if (!grid) return;
      var first = grid.querySelector('.ncard');
      for (var i=0;i<2;i++){
        var c = first.cloneNode(true);
        var ti = c.querySelector('.ti');
        if (ti) ti.textContent = (i===0 ? '11월 아카이브 점검 안내' : '12월 굿즈 출시 소식');
        grid.appendChild(c);
      }
    }catch(e){}
  }.bind(this), 1400);
});
</script>
</body>
</html>
